<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Fruit Ninja — TS Edition</title>
    <meta name="description" content="Slice fruit in real time using webcam hand gestures and MediaPipe powered by TypeScript and HTML5 Canvas." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- MediaPipe CDN scripts fallback for seamless browser compatibility -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script type="module" crossorigin src="/assets/index-_0vqlbPt.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bf9mesWr.css">
  </head>
  <body>
    <div id="app">
      <!-- Hidden Video Element for Webcam Stream -->
      <video id="webcam" playsinline style="display: none;"></video>

      <!-- Main Game Canvas -->
      <canvas id="game-canvas" width="960" height="720"></canvas>

      <!-- Glassmorphism Controls & Status Overlay -->
      <div id="ui-container">
        <div class="top-bar">
          <div class="status-badge" id="camera-status">
            <span class="dot yellow"></span>
            <span id="camera-status-text">Initializing Camera...</span>
          </div>

          <div class="controls-bar">
            <button id="toggle-input-btn" class="glass-btn small" title="Toggle between Hand Gesture tracking & Mouse/Touch">
              <span id="input-mode-icon">🖐️</span> <span id="input-mode-label">Hand Tracking</span>
            </button>
            <button id="toggle-sound-btn" class="glass-btn small" title="Toggle Sound">
              <span id="sound-icon">🔊</span>
            </button>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
